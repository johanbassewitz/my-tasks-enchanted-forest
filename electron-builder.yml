appId: com.mytasks.forest
productName: Daywhisper
copyright: Copyright © 2026 Daywhisper
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - build/icon.ico
  - package.json
asar: true
npmRebuild: false
electronVersion: 43.8.7
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  signAndEditExecutable: true
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Daywhisper
  deleteAppDataOnUninstall: false
  artifactName: Daywhisper-Setup-${version}-x64.${ext}
portable:
  artifactName: Daywhisper-Portable-${version}.${ext}
